  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fc8019"/><stop offset="1" stop-color="#ffb45e"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="1065" cy="72" r="130" fill="#ffffff" opacity=".06"/>
  <circle cx="1110" cy="250" r="95" fill="#ffffff" opacity=".05"/>
  <path d="M0 263 C220 210 350 315 600 250 S970 190 1200 235" fill="none" stroke="url(#accent)" stroke-width="7" opacity=".85"/>
