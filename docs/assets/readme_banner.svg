  <text x="1012" y="111" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">ELT</text>
  <text x="1012" y="143" fill="#d7e8f0" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">FROM CSV TO INSIGHT</text>
