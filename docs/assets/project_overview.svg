<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Food Delivery Analytics — project overview</title>
  <desc id="desc">A synthetic-data analytics project using Snowflake, dbt, Python, and Streamlit. It analyzes 10 million orders and forecasts quarterly city revenue.</desc>

  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FC8019"/>
      <stop offset="1" stop-color="#FF9D42"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#34251A" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#FC8019"/>
    </marker>
  </defs>

  <rect width="1440" height="900" rx="30" fill="#FFF9F3"/>
  <rect x="0" y="0" width="1440" height="14" fill="url(#orange)"/>
  <circle cx="1360" cy="96" r="170" fill="#FC8019" opacity=".045"/>
  <circle cx="1320" cy="80" r="112" fill="#FC8019" opacity=".035"/>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <!-- Header -->
    <text x="78" y="82" fill="#FC8019" font-size="15" font-weight="700" letter-spacing="2.4">PORTFOLIO PROJECT</text>
    <text x="76" y="139" fill="#24212B" font-size="43" font-weight="750">Food Delivery Analytics</text>
    <text x="80" y="178" fill="#6F6870" font-size="19">From Snowflake ELT to city-level revenue forecasting</text>

    <rect x="1130" y="65" width="230" height="44" rx="22" fill="#FFF0E2" stroke="#FFD3AE"/>
    <circle cx="1154" cy="87" r="6" fill="#FC8019"/>
    <text x="1171" y="92" fill="#A94E0B" font-size="13" font-weight="700" letter-spacing="1">SYNTHETIC DATA</text>

    <!-- Technology strip -->
    <g font-size="13" font-weight="700">
      <!-- Snowflake -->
      <rect x="80" y="204" width="130" height="34" rx="17" fill="#28252D"/>
      <text x="145" y="226" text-anchor="middle" fill="#FFFFFF">SNOWFLAKE</text>
      
      <!-- dbt -->
      <rect x="222" y="204" width="86" height="34" rx="17" fill="#28252D"/>
      <text x="265" y="226" text-anchor="middle" fill="#FFFFFF">dbt</text>
      
      <!-- Python -->
      <rect x="320" y="204" width="100" height="34" rx="17" fill="#28252D"/>
      <text x="370" y="226" text-anchor="middle" fill="#FFFFFF">PYTHON</text>
      
      <!-- Streamlit -->
      <rect x="432" y="204" width="112" height="34" rx="17" fill="#28252D"/>
      <text x="488" y="226" text-anchor="middle" fill="#FFFFFF">STREAMLIT</text>
      
      <!-- Analytics | Forecast (Widened to 180px, shifted x to 556) -->
      <rect x="556" y="204" width="180" height="34" rx="17" fill="#28252D"/>
      <text x="646" y="226" text-anchor="middle" fill="#FFFFFF">ANALYTICS | FORECAST</text>
      
      <!-- LLM | RAG (Widened to 110px, shifted x to 748) -->
      <rect x="748" y="204" width="110" height="34" rx="17" fill="#28252D"/>
      <text x="803" y="226" text-anchor="middle" fill="#FFFFFF">LLM | RAG</text>
    </g>


    <!-- Architecture -->
    <text x="80" y="291" fill="#3A343B" font-size="15" font-weight="700" letter-spacing="1.7">PROJECT FLOW</text>
    <text x="1360" y="291" text-anchor="end" fill="#9A9299" font-size="13">LOCAL DATA → BUSINESS INSIGHT</text>

    <g filter="url(#shadow)">
      <rect x="80" y="315" width="190" height="126" rx="18" fill="#FFFFFF"/>
      <rect x="307" y="315" width="190" height="126" rx="18" fill="#FFFFFF"/>
      <rect x="534" y="315" width="190" height="126" rx="18" fill="#FFFFFF"/>
      <rect x="761" y="315" width="190" height="126" rx="18" fill="#FFFFFF"/>
      <rect x="988" y="315" width="190" height="126" rx="18" fill="#FFFFFF"/>
      <rect x="1215" y="315" width="145" height="126" rx="18" fill="#FFFFFF"/>
    </g>

    <!-- Card accent bars -->
    <g fill="url(#orange)">
      <rect x="80" y="315" width="190" height="6" rx="3"/>
      <rect x="307" y="315" width="190" height="6" rx="3"/>
      <rect x="534" y="315" width="190" height="6" rx="3"/>
      <rect x="761" y="315" width="190" height="6" rx="3"/>
      <rect x="988" y="315" width="190" height="6" rx="3"/>
      <rect x="1215" y="315" width="145" height="6" rx="3"/>
    </g>

    <g>
      <text x="98" y="357" fill="#FC8019" font-size="12" font-weight="700" letter-spacing="1">01 · SOURCE</text>
      <text x="98" y="388" fill="#28252D" font-size="19" font-weight="700">Local files</text>
      <text x="98" y="415" fill="#777078" font-size="14">CSV / CSV.GZ</text>

      <text x="325" y="357" fill="#FC8019" font-size="12" font-weight="700" letter-spacing="1">02 · BRONZE</text>
      <text x="325" y="388" fill="#28252D" font-size="19" font-weight="700">Snowflake RAW</text>
      <text x="325" y="415" fill="#777078" font-size="14">Stage and load</text>

      <text x="552" y="357" fill="#FC8019" font-size="12" font-weight="700" letter-spacing="1">03 · SILVER</text>
      <text x="552" y="388" fill="#28252D" font-size="19" font-weight="700">dbt staging</text>
      <text x="552" y="415" fill="#777078" font-size="14">Clean and standardize</text>

      <text x="779" y="357" fill="#FC8019" font-size="12" font-weight="700" letter-spacing="1">04 · GOLD</text>
      <text x="779" y="388" fill="#28252D" font-size="19" font-weight="700">Analytics models</text>
      <text x="779" y="415" fill="#777078" font-size="14">Facts · dimensions · marts</text>

      <text x="1006" y="357" fill="#FC8019" font-size="12" font-weight="700" letter-spacing="1">05 · ANALYZE</text>
      <text x="1006" y="388" fill="#28252D" font-size="19" font-weight="700">Python</text>
      <text x="1006" y="415" fill="#777078" font-size="14">EDA · features · model</text>

      <text x="1233" y="357" fill="#FC8019" font-size="12" font-weight="700" letter-spacing="1">06 · APP</text>
      <text x="1233" y="388" fill="#28252D" font-size="18" font-weight="700">Streamlit</text>
      <text x="1233" y="415" fill="#777078" font-size="13">KPIs · text-to-SQL</text>
    </g>

    <g fill="none" stroke="#FC8019" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M275 378H298"/>
      <path d="M502 378H525"/>
      <path d="M729 378H752"/>
      <path d="M956 378H979"/>
      <path d="M1183 378H1206"/>
    </g>

    <!-- KPI cards -->
    <text x="80" y="497" fill="#3A343B" font-size="15" font-weight="700" letter-spacing="1.7">PROJECT SNAPSHOT</text>

    <g filter="url(#shadow)">
      <rect x="80" y="520" width="300" height="139" rx="18" fill="#FFFFFF"/>
      <rect x="405" y="520" width="300" height="139" rx="18" fill="#FFFFFF"/>
      <rect x="730" y="520" width="300" height="139" rx="18" fill="#FFFFFF"/>
      <rect x="1055" y="520" width="305" height="139" rx="18" fill="#FFFFFF"/>
    </g>

    <g>
      <text x="108" y="556" fill="#8A8289" font-size="12" font-weight="700" letter-spacing="1.2">ORDERS ANALYZED</text>
      <text x="108" y="610" fill="#28252D" font-size="39" font-weight="750">10.0M</text>
      <text x="108" y="638" fill="#777078" font-size="13">Jan 2024 – Jun 2026</text>

      <text x="433" y="556" fill="#8A8289" font-size="12" font-weight="700" letter-spacing="1.2">CITIES IN FORECAST</text>
      <text x="433" y="610" fill="#28252D" font-size="39" font-weight="750">552</text>
      <text x="433" y="638" fill="#777078" font-size="13">Quarterly city-level model</text>

      <text x="758" y="556" fill="#8A8289" font-size="12" font-weight="700" letter-spacing="1.2">RATING COVERAGE</text>
      <text x="758" y="610" fill="#28252D" font-size="39" font-weight="750">2.96%</text>
      <text x="758" y="638" fill="#777078" font-size="13">Most orders have no rating</text>

      <text x="1083" y="556" fill="#8A8289" font-size="12" font-weight="700" letter-spacing="1.2">2026 Q3 FORECAST</text>
      <text x="1083" y="610" fill="#FC8019" font-size="37" font-weight="750">₹506.25M</text>
      <text x="1083" y="638" fill="#777078" font-size="13">Across 552 cities · synthetic</text>
    </g>

    <!-- Model evaluation -->
    <rect x="80" y="700" width="1280" height="112" rx="20" fill="#29262D"/>
    <rect x="80" y="700" width="8" height="112" rx="4" fill="url(#orange)"/>

    <text x="112" y="739" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="1">2026 Q2 HOLDOUT · WMAPE</text>
    <text x="112" y="779" fill="#BDB7BE" font-size="14">LightGBM</text>
    <text x="207" y="780" fill="#FFFFFF" font-size="22" font-weight="700">1.40%</text>

    <line x1="450" y1="724" x2="450" y2="786" stroke="#514B54" stroke-width="1.5"/>

    <text x="490" y="779" fill="#BDB7BE" font-size="14">Historical-average baseline</text>
    <text x="704" y="780" fill="#FFFFFF" font-size="22" font-weight="700">1.36%</text>

    <rect x="958" y="724" width="367" height="62" rx="14" fill="#3A302B"/>
    <circle cx="982" cy="755" r="6" fill="#FC8019"/>
    <text x="1000" y="751" fill="#FFB77D" font-size="14" font-weight="700">BASELINE PERFORMED BETTER</text>
    <text x="1000" y="772" fill="#D2C7C0" font-size="12">The model did not beat it on this test quarter.</text>

    <!-- Footer -->
    <text x="80" y="858" fill="#817980" font-size="13">Demonstration project · all data and results are synthetic and do not represent Swiggy’s real performance.</text>
    <text x="1360" y="858" text-anchor="end" fill="#A29AA1" font-size="12" font-weight="700" letter-spacing="1">ELT  ·  MEDALLION  ·  STAR SCHEMA</text>
  </g>
</svg>